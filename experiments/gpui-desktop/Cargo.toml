[package]
name = "watra-gpui-prototype"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
objc2 = "0.6"
cocoa = "=0.26.0"
cef = "=156.2.0"
raw-window-handle = "0.6"
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }

[workspace]

[package.metadata.cef.bundle]
helper_name = "watra-gpui-helper"

[[bin]]
name = "watra-gpui-prototype"
path = "src/main.rs"

[[bin]]
name = "watra-gpui-helper"
path = "src/helper.rs"

[features]
default = ["sandbox"]
sandbox = ["cef/sandbox"]
