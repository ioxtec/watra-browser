name: Engine core

on:
  push:
  pull_request:

jobs:
  test-engine-core:
    name: Engine core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p watra-engine-api -p watra-core
