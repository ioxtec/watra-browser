[workspace]
members = [
    "apps/watra-desktop",
    "crates/watra-core",
    "crates/watra-engine-api",
    "crates/watra-engine-cef",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.lints.rust]
# Keep unsafe out of ordinary crates while allowing explicit FFI module boundaries.
unsafe_code = "deny"

